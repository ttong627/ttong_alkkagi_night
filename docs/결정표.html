const DECISIONS = DATA.decisions;

const state = {};
let db = null, me = "";

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function frame(){
  document.getElementById("h1").textContent = DATA.title || "결정표";
  document.getElementById("intro").innerHTML = DATA.intro || "";
  document.getElementById("foot").innerHTML = DATA.footer || "다 고르면 대화창에 「결정표 다 했어」라고만 말해 주세요.";
  const box = document.getElementById("groups");
  (DATA.groups || [{id:"A", title:"결정"}]).forEach((g) => {
    const sec = el("section", {class:"wrap", style:"gap:14px"});
    const h = el("h2", {}, g.title);
    if (g.desc) h.append(el("small", {}, g.desc));
    sec.append(h, el("div", {id:"group"+g.id, class:"wrap", style:"gap:14px"}));
    box.append(sec);
  });
}

function render(){
  (DATA.groups || [{id:"A"}]).forEach((g) => document.getElementById("group"+g.id).replaceChildren());
  DECISIONS.forEach((d) => {
    const cur = state[d.id] || {};
    const card = el("article", {class:"card"+(cur.choice?" done":""), id:"card-"+d.id});
    card.append(el("h3", {}, el("span",{class:"tag"}, cur.choice ? "고름 ✓" : d.tag), d.title));
    card.append(el("p", {class:"why", html:d.why}));
    const opts = el("div", {class:"opts", role:"group", "aria-label":d.title});
    d.opts.forEach(([label, hint, rec]) => {
      const b = el("button", {class:"opt", type:"button", "aria-pressed": String(cur.choice === label)});
      const s = el("span", {}, label);
      if (rec) s.append(el("span",{class:"rec"},"권장"));
      if (hint) s.append(el("em",{}, hint));
      b.append(el("span",{class:"dot","aria-hidden":"true"}), s);
      b.addEventListener("click", () => save(d.id, { choice: label }));
      opts.append(b);
    });
    card.append(opts);

    const fieldsWrap = el("div", {class:"fields"});
    (d.fields||[]).forEach(([key, lab, ph, type]) => {
      const inp = el("input", {class:"field", id:`f-${d.id}-${key}`, type:type||"text", placeholder:ph||""});
      inp.value = (cur.fields && cur.fields[key]) || "";
      fieldsWrap.append(el("label", {class:"lab", for:inp.id}, lab, inp));
    });
    const memo = el("textarea", {class:"field", id:`f-${d.id}-memo`, placeholder:"하고 싶은 말이 있으면 (없어도 돼요)"});
    memo.value = cur.memo || "";
    fieldsWrap.append(el("label", {class:"lab", for:memo.id, style:"grid-column:1/-1"}, "메모", memo));
    card.append(fieldsWrap);

    const row = el("div", {class:"row"});
    const btn = el("button", {class:"save", type:"button"}, "적은 내용 저장");
    const note = el("span", {class:"saved", id:"saved-"+d.id, "aria-live":"polite"}, cur.at ? "저장됨 · " + fmt(cur.at) : "");
    btn.addEventListener("click", () => {
      const fields = {};
      (d.fields||[]).forEach(([key]) => { fields[key] = document.getElementById(`f-${d.id}-${key}`).value.trim(); });
      save(d.id, { fields, memo: memo.value.trim() });
    });
    row.append(btn, note);
    card.append(row);
    (document.getElementById("group"+(d.group||"A")) || document.getElementById("groups")).append(card);
  });
  const n = DECISIONS.filter(d => state[d.id] && state[d.id].choice).length;
  document.getElementById("count").textContent = `${n} / ${DECISIONS.length}`;
  document.getElementById("meter").style.width = (n / DECISIONS.length * 100) + "%";
}

function fmt(iso){
  try { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
  catch { return ""; }
}

async function save(id, patch){
  const prev = state[id] || {};
  const next = { ...prev, ...patch, at: new Date().toISOString(), by: me };
  state[id] = next;
  render();
  const note = document.getElementById("saved-"+id);
  if (!db) { if (note) { note.textContent = "이 화면에서는 저장이 안 돼요 — 대화창에 알려 주세요"; note.className = "saved err"; } return; }
  try {
    await db.doc("decisions/" + id).set(next);
    if (note) { note.textContent = "저장됨 · " + fmt(next.at); note.className = "saved"; }
  } catch (e) {
    if (note) { note.textContent = "저장 실패 — 잠시 뒤 다시 눌러 주세요"; note.className = "saved err"; }
  }
}

function setStatus(text, bad){
  const s = document.getElementById("status");
  s.textContent = text; s.className = "status" + (bad ? " bad" : "");
}

frame();
render();

(async () => {
  const timer = setTimeout(() => setStatus("저장소 응답이 늦어요. 눌러 둔 것은 이 화면에만 보일 수 있어요.", true), 10000);
  try {
    const c = window.claude;
    db = c && c.use ? await c.use("db") : null;
    const user = c && c.use ? await c.use("user") : null;
    if (user && user.id) { try { me = (await user.id()) || ""; } catch { me = ""; } }
    if (!db) { clearTimeout(timer); setStatus("이 화면에서는 저장이 안 돼요(로그인하지 않은 화면). 고른 것을 대화창에 말해 주세요.", true); return; }
    db.collection("decisions").onSnapshot((snap) => {
      clearTimeout(timer);
      snap.docs.forEach((doc) => { if (doc.exists) state[doc.id] = { ...doc.data() }; });
      setStatus("누르는 즉시 저장돼요. 안토니가 이 결과를 읽어요.");
      render();
    }, () => { clearTimeout(timer); setStatus("저장소를 읽지 못했어요. 새로 고침 해 주세요.", true); });
  } catch {
    clearTimeout(timer);
    setStatus("저장소에 연결하지 못했어요. 고른 것을 대화창에 말해 주세요.", true);
  }
})();
</script>
