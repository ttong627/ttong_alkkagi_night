name: alkkagi_night
description: "수호알까기 · 탄지무림 심야기습 — 자동 탄지 진법으로 열 마을을 지키는 무협 물리 디펜스"
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  defense_core:
    path: ../packages/defense_core
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/chars/
    - assets/images/scenes/
    - assets/images/icons/
    - assets/images/fx/
    - assets/images/obstacles/
    - assets/images/mutants/
    - assets/images/launchers/
    - assets/images/stones/
    - assets/licenses/
  fonts:
    - family: BlackHanSans
      fonts:
        - asset: assets/fonts/BlackHanSans-Regular.ttf
    - family: DoHyeon
      fonts:
        - asset: assets/fonts/DoHyeon-Regular.ttf
    - family: NotoKRFallback
      fonts:
        - asset: assets/fonts/NotoSansKR-Fallback.ttf
